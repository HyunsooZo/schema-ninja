<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Prettier - Ninja Dev Tools</title>
  <link rel="stylesheet" href="css/style.css" />

  <meta property="og:type" content="website">
  <meta property="og:title" content="JSON Prettier - Ninja Dev Tools">
  <meta property="og:description" content="Format, validate, and minify JSON with configurable indentation and key sorting.">
  <meta property="og:image" content="images/preview-logo.jpeg">

  <!-- highlight.js for output syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    id="hljs-theme" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>

  <style>
    .stat-chips {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-family: monospace;
      background: var(--code-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .stat-chip span {
      color: var(--accent-color);
      font-weight: 600;
    }

    .error-banner {
      display: none;
      padding: 8px 16px;
      background: #ff000022;
      border-bottom: 1px solid #ff000066;
      color: #ff6b6b;
      font-size: 12px;
      font-family: monospace;
      line-height: 1.5;
    }

    .error-banner.visible {
      display: block;
    }

    .prettier-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .prettier-toolbar select,
    .prettier-toolbar input[type="checkbox"] {
      cursor: pointer;
    }

    .prettier-select {
      padding: 5px 8px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--code-bg);
      color: var(--text-color);
      cursor: pointer;
    }

    .prettier-option {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: var(--text-color);
      cursor: pointer;
      white-space: nowrap;
    }

    .prettier-option input[type="checkbox"] {
      width: 15px;
      height: 15px;
    }

    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: var(--border-color);
      flex-shrink: 0;
    }

    .btn-minify {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      font-size: 12px;
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-minify:hover {
      background: var(--code-bg);
    }
  </style>
</head>

<body data-theme="dark">
  <header>
    <div class="brand-wrapper">
      <h1>
        <a href="index.html" style="display: inline-flex; align-items: center; text-decoration: none; color: inherit;">
          <img src="images/logo.jpg" alt="Schema Ninja Logo" class="app-logo" style="cursor: pointer;" />
        </a>
        JSON Prettier
      </h1>
      <span class="app-tagline">Format, validate, and minify JSON instantly.</span>
    </div>

    <button class="theme-toggle" onclick="toggleTheme()">Light Mode</button>
  </header>

  <main>
    <div class="editor-container">

      <!-- Toolbar: Formatting Options -->
      <div class="prettier-toolbar">
        <label class="prettier-option" style="gap: 6px;">
          <span style="color: var(--text-muted); font-size: 12px;">Indent</span>
          <select class="prettier-select" id="indent-select" onchange="handleFormat()">
            <option value="2">2 Spaces</option>
            <option value="4">4 Spaces</option>
            <option value="tab">Tab</option>
          </select>
        </label>

        <div class="toolbar-divider"></div>

        <label class="prettier-option">
          <input type="checkbox" id="sort-keys" onchange="handleFormat()" />
          Sort Keys
        </label>

        <label class="prettier-option">
          <input type="checkbox" id="auto-format" checked onchange="toggleAutoFormat()" />
          Auto
        </label>

        <div class="toolbar-divider"></div>

        <button class="action-btn" onclick="handleFormat()">
          Format
        </button>
      </div>

      <!-- Error Banner -->
      <div class="error-banner" id="error-banner"></div>

      <div class="editor-wrapper">
        <pre id="input-highlight-layer" class="code-highlight code-font-style"></pre>
        <textarea
          id="json-input"
          class="code-input code-font-style"
          placeholder='Paste or type JSON here...

{
  "name": "John Doe",
  "age": 30,
  "active": true,
  "tags": ["dev", "ninja"]
}'
          spellcheck="false"
          oninput="handleInput(this)"
          onscroll="syncScroll(this)"
        ></textarea>
      </div>
    </div>

    <div class="resizer" id="resizer"></div>

    <div class="preview-container">
      <div class="preview-toolbar">
        <div class="toolbar-left">
          <div class="stat-chips" id="stat-chips">
            <span class="stat-chip">Ready</span>
          </div>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <button class="btn-minify" onclick="handleMinify()" title="Minify JSON">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 14 10 14 10 20"></polyline>
              <polyline points="20 10 14 10 14 4"></polyline>
              <line x1="14" y1="10" x2="21" y2="3"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
            Minify
          </button>
          <button class="icon-btn" onclick="copyOutput()" title="Copy Output">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>

      <pre style="margin:0; height: calc(100% - 49px); overflow: auto; background: var(--code-bg);">
        <code id="json-output" class="language-json code-font-style"
          style="display: block; min-height: 100%; padding: 20px; background: transparent;"></code>
      </pre>
    </div>
  </main>

  <script src="js/json-prettier.js"></script>
</body>

</html>
